<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arcvex Big Pets — Mutable NFTs on the XRP Ledger</title>
<meta name="description" content="Arcvex Big Pets — 3,333 mutable pet NFTs on the XRP Ledger. Mint one on our own launchpad.">
<meta property="og:title" content="Arcvex Big Pets">
<meta property="og:description" content="3,333 mutable pet NFTs on the XRP Ledger. Mint one.">
<meta property="og:image" content="https://images.weserv.nl/?url=xayoujiqufvlyiakyqaw.supabase.co/storage/v1/object/public/arcvex-lions/Lion_2868.png&w=800&output=jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://images.weserv.nl" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FFF1CF; --blue:#2F6BFF; --red:#FF4438; --yellow:#FFC83D;
    --ink:#141414; --white:#fff;
    --bg-image:url('https://mint.arcvex.io/static/bg.png');
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--cream); color:var(--ink);
    font-family:'Fredoka',system-ui,sans-serif;
    min-height:100vh; overflow:hidden; position:relative;
    display:flex; flex-direction:column;
  }
  h1,h2,h3{font-family:'Bangers',sans-serif}
  a{text-decoration:none;color:inherit}
  .custom-bg{position:fixed;inset:0;z-index:0;background-image:var(--bg-image);
    background-size:cover;background-position:center;pointer-events:none}
  .dots{position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:radial-gradient(var(--ink) 2px,transparent 2px);
    background-size:24px 24px;opacity:.05}

  /* ---------- gallery marquee (3 rows, behind) ---------- */
  .gallery{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;
    justify-content:center;gap:clamp(10px,1.8vh,18px);pointer-events:none}
  .row{display:flex;gap:clamp(12px,1.6vw,20px);width:max-content;will-change:transform}
  .row.a{animation:scrollL 85s linear infinite}
  .row.b{animation:scrollR 100s linear infinite}
  .row.c{animation:scrollL 120s linear infinite}
  @keyframes scrollL{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  @keyframes scrollR{from{transform:translateX(-50%)}to{transform:translateX(0)}}
  .lion{flex:0 0 auto;width:clamp(108px,15vh,168px);aspect-ratio:1;
    border:4px solid var(--ink);border-radius:16px;overflow:hidden;background:#1c1c1c;
    box-shadow:6px 6px 0 rgba(20,20,20,.3);transform:rotate(-2deg)}
  .row.b .lion{transform:rotate(2deg)}
  .lion img{width:100%;height:100%;object-fit:cover;display:block}

  /* ---------- brand bar ---------- */
  header{position:relative;z-index:4;display:flex;align-items:center;
    padding:20px clamp(18px,4vw,42px)}
  .brand{display:flex;align-items:center;gap:10px;font-family:'Bangers';
    font-size:1.6rem;letter-spacing:1.5px;text-shadow:2px 2px 0 var(--white)}
  .brand .a{color:var(--blue)} .brand .l{color:var(--red)}
  .brand .badge{width:34px;height:34px;background:var(--yellow);border:3px solid var(--ink);
    border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1rem;
    box-shadow:3px 3px 0 var(--ink)}

  /* ---------- center card ---------- */
  main{position:relative;z-index:4;flex:1;display:flex;align-items:center;justify-content:center;
    padding:10px 20px 40px}
  .card{background:var(--white);border:5px solid var(--ink);border-radius:26px;
    box-shadow:12px 12px 0 var(--ink);padding:clamp(24px,4vw,42px) clamp(22px,5vw,54px);
    text-align:center;max-width:540px}
  .kicker{font-weight:700;font-size:clamp(.72rem,2vw,.9rem);letter-spacing:1px;
    text-transform:uppercase;color:var(--blue);
    background:var(--cream);border:3px solid var(--ink);border-radius:99px;
    padding:6px 16px;box-shadow:3px 3px 0 var(--ink);display:inline-block;transform:rotate(-2deg)}
  h1{font-family:'Bangers';font-weight:400;line-height:.9;letter-spacing:2px;
    font-size:clamp(3rem,11vw,6rem);margin:16px 0 4px;color:var(--ink);
    text-shadow:5px 5px 0 var(--yellow), 8px 8px 0 var(--ink)}
  h1 .blue{color:var(--blue)}
  .supply{display:inline-flex;align-items:center;gap:9px;font-family:'Bangers';
    font-size:clamp(1.05rem,3.4vw,1.5rem);letter-spacing:1.5px;
    background:var(--yellow);border:4px solid var(--ink);border-radius:13px;
    padding:5px 16px;box-shadow:4px 4px 0 var(--ink);transform:rotate(-2deg);margin:16px 0 22px}
  .supply .dot{width:12px;height:12px;border-radius:50%;background:var(--red);border:2px solid var(--ink)}
  .mint{font-family:'Bangers';font-size:clamp(1.5rem,5vw,2.2rem);letter-spacing:2px;
    color:var(--white);background:var(--red);border:4px solid var(--ink);border-radius:18px;
    padding:14px 40px;cursor:pointer;text-decoration:none;display:inline-block;
    box-shadow:7px 7px 0 var(--ink);transition:.1s}
  .mint:hover{transform:translate(-2px,-2px);box-shadow:10px 10px 0 var(--ink)}
  .mint:active{transform:translate(4px,4px);box-shadow:2px 2px 0 var(--ink)}
  /* frozen "coming soon" state — non-clickable */
  .mint.soon{background:var(--yellow);color:var(--ink);cursor:not-allowed;pointer-events:none}
  .mint.soon:hover,.mint.soon:active{transform:none;box-shadow:7px 7px 0 var(--ink)}
  .note{margin-top:16px;font-weight:600;font-size:.9rem;opacity:.8}
  .note b{color:var(--blue)}

  footer{position:relative;z-index:4;text-align:center;padding:12px;
    font-weight:600;font-size:.74rem;color:var(--ink);
    background:rgba(255,241,207,.7)}

  @media(prefers-reduced-motion:reduce){.row.a,.row.b,.row.c{animation:none}}
</style>
</head>
<body>

<div class="custom-bg"></div>
<div class="dots"></div>

<!-- gallery rows are generated by JS (see bottom) -->
<div class="gallery" aria-hidden="true"></div>

<header>
  <span class="brand">
    <span class="badge">🐾</span>
    <span><span class="a">ARCVEX</span> <span class="l">BIG PETS</span></span>
  </span>
</header>

<main>
  <div class="card">
    <span class="kicker">Mutable NFTs · XRP Ledger</span>
    <h1>ARCVEX <span class="blue">BIG PETS</span></h1>
    <div class="supply"><span class="dot"></span> 3,333 PETS</div>
    <br>
    <span class="mint soon" role="button" aria-disabled="true">COMING SOON!</span>
    <p class="note">Pets that <b>evolve</b> after you mint them. Built on XRPL.</p>
  </div>
</main>

<footer>© 2026 Arcvex · NFTs carry risk — only spend what you can afford to lose.</footer>

<script>
// gallery builder — TOP 100 RAREST Big Pets (live media_url filenames), 3 scrolling rows via images.weserv.nl
// Filenames vary (Lion_… / pet_…) and do NOT match NFT numbers — always use the stored filename.
const PETS = ["Lion_2868.png","Lion_3021.png","Lion_1735.png","Lion_1582.png","Lion_0739.png","Lion_1761.png","Lion_2912.png","Lion_1762.png","pet_1083_b1428d3c.png","pet_0768_ae322493.png","pet_1469_2dd718ad.png","Lion_2782.png","pet_0898_92016273.png","pet_1970_45c0b825.png","pet_1776_a0970589.png","Lion_1703.png","pet_2678_eb761992.png","pet_2356_86761566.png","pet_2737_4431196e.png","pet_2367_b3e1094c.png","pet_1591_2d4ea431.png","Lion_2061.png","pet_2652_c9fd964f.png","pet_0952_252d4136.png","Lion_3104.png","pet_3147_4d8e3ebb.png","Lion_2118.png","Lion_0909.png","Lion_1376.png","pet_2564_6a4e7f07.png","Lion_2661.png","pet_2160_58ed53ae.png","Lion_1754.png","pet_0679_1d714a70.png","Lion_3002.png","pet_2050_55b24565.png","pet_0809_6e91b3c5.png","Lion_1411.png","Lion_2354.png","Lion_1369.png","Lion_2914.png","pet_0778_bd71f1e6.png","pet_2419_93511e2c.png","Lion_1311.png","Lion_3110.png","Lion_1851.png","Lion_2019.png","Lion_3192.png","Lion_2173.png","Lion_1629.png","Lion_1300.png","Lion_2375.png","Lion_2888.png","Lion_2481.png","Lion_2864.png","Lion_1015.png","Lion_2939.png","Lion_2171.png","Lion_3134.png","Lion_0976.png","Lion_0649.png","Lion_0587.png","Lion_0132.png","Lion_0787.png","Lion_2372.png","pet_1675_d714591a.png","Lion_1372.png","Lion_2994.png","Lion_0138.png","Lion_2808.png","Lion_1969.png","Lion_2222.png","Lion_1796.png","pet_2848_ff560cb4.png","Lion_1669.png","Lion_2505.png","Lion_2110.png","Lion_2017.png","Lion_0500.png","Lion_2927.png","Lion_1389.png","Lion_3087.png","pet_2869_7d331fd7.png","Lion_2155.png","Lion_2141.png","pet_2803_38800bbd.png","Lion_2610.png","Lion_2983.png","Lion_0277.png","Lion_0582.png","Lion_2907.png","Lion_2373.png","Lion_2273.png","Lion_2186.png","Lion_1131.png","Lion_2947.png","Lion_2627.png","Lion_1111.png","Lion_2030.png","Lion_2244.png"];
const petUrl = f => `https://images.weserv.nl/?url=xayoujiqufvlyiakyqaw.supabase.co/storage/v1/object/public/arcvex-lions/${f}&w=340&q=72&output=webp`;
(function buildGallery(){
  const g = document.querySelector('.gallery');
  const rows = 3, cls = ['a','b','c'];
  const per = Math.ceil(PETS.length / rows);
  for(let r=0;r<rows;r++){
    let set = PETS.slice(r*per, r*per+per);
    if(set.length < 4) set = PETS;
    const row = document.createElement('div');
    row.className = 'row ' + cls[r];
    [...set, ...set].forEach((f,i)=>{
      const d = document.createElement('div'); d.className = 'lion';
      const img = document.createElement('img');
      img.loading = (r===0 && i<5) ? 'eager' : 'lazy';
      img.src = petUrl(f); img.alt = '';
      d.appendChild(img); row.appendChild(d);
    });
    g.appendChild(row);
  }
})();
</script>
</body>
</html>
