<style>
  :root{
    --cream:#FFF1CF; --blue:#2F6BFF; --red:#FF4438; --yellow:#FFC83D;
    --ink:#141414; --white:#fff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--cream); color:var(--ink);
    font-family:'Fredoka',system-ui,sans-serif;
    min-height:100vh; overflow:hidden; position:relative;
    display:flex; flex-direction:column;
  }
  .dots{position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:radial-gradient(var(--ink) 2px,transparent 2px);
    background-size:24px 24px;opacity:.05}

  /* ---------- gallery marquee (behind) ---------- */
  .gallery{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;
    justify-content:center;gap:clamp(14px,2.5vh,26px);pointer-events:none}
  .row{display:flex;gap:clamp(14px,2vw,24px);width:max-content;will-change:transform}
  .row.a{animation:scrollL 75s linear infinite}
  .row.b{animation:scrollR 90s linear infinite}
  @keyframes scrollL{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  @keyframes scrollR{from{transform:translateX(-50%)}to{transform:translateX(0)}}
  .lion{flex:0 0 auto;width:clamp(150px,21vh,230px);aspect-ratio:1;
    border:5px solid var(--ink);border-radius:18px;overflow:hidden;background:#1c1c1c;
    box-shadow:7px 7px 0 rgba(20,20,20,.35);transform:rotate(-2deg)}
  .row.b .lion{transform:rotate(2deg)}
  .lion img{width:100%;height:100%;object-fit:cover;display:block}
  .scrim{position:fixed;inset:0;z-index:2;pointer-events:none;
    background:radial-gradient(ellipse 60% 75% at 50% 50%,
      rgba(255,241,207,.92) 0%, rgba(255,241,207,.74) 38%, rgba(255,241,207,.30) 70%, rgba(255,241,207,0) 100%)}

  /* ---------- brand bar ---------- */
  header{position:relative;z-index:4;display:flex;align-items:center;
    padding:20px clamp(18px,4vw,42px)}
  .brand{display:flex;align-items:center;gap:10px;font-family:'Bangers';
    font-size:1.6rem;letter-spacing:1.5px}
  .brand .a{color:var(--blue)} .brand .l{color:var(--red)}
  .brand .badge{width:34px;height:34px;background:var(--yellow);border:3px solid var(--ink);
    border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1rem;
    box-shadow:3px 3px 0 var(--ink)}

  /* ---------- center card ---------- */
  main{position:relative;z-index:4;flex:1;display:flex;align-items:center;justify-content:center;
    padding:10px 20px 40px}
  .card{background:var(--white);border:5px solid var(--ink);border-radius:26px;
    box-shadow:12px 12px 0 var(--ink);padding:clamp(24px,4vw,42px) clamp(22px,5vw,54px);
    text-align:center;max-width:540px}
  .kicker{font-weight:700;font-size:clamp(.72rem,2vw,.9rem);letter-spacing:1px;
    text-transform:uppercase;color:var(--blue);
    background:var(--cream);border:3px solid var(--ink);border-radius:99px;
    padding:6px 16px;box-shadow:3px 3px 0 var(--ink);display:inline-block;transform:rotate(-2deg)}
  h1{font-family:'Bangers';font-weight:400;line-height:.9;letter-spacing:2px;
    font-size:clamp(3rem,11vw,6rem);margin:16px 0 4px;color:var(--ink);
    text-shadow:5px 5px 0 var(--yellow), 8px 8px 0 var(--ink)}
  h1 .blue{color:var(--blue)}
  .supply{display:inline-flex;align-items:center;gap:9px;font-family:'Bangers';
    font-size:clamp(1.05rem,3.4vw,1.5rem);letter-spacing:1.5px;
    background:var(--yellow);border:4px solid var(--ink);border-radius:13px;
    padding:5px 16px;box-shadow:4px 4px 0 var(--ink);transform:rotate(-2deg);margin:16px 0 22px}
  .supply .dot{width:12px;height:12px;border-radius:50%;background:var(--red);border:2px solid var(--ink)}
  .mint{font-family:'Bangers';font-size:clamp(1.5rem,5vw,2.2rem);letter-spacing:2px;
    color:var(--white);background:var(--red);border:4px solid var(--ink);border-radius:18px;
    padding:14px 40px;cursor:pointer;text-decoration:none;display:inline-block;
    box-shadow:7px 7px 0 var(--ink);transition:.1s}
  .mint:hover{transform:translate(-2px,-2px);box-shadow:10px 10px 0 var(--ink)}
  .mint:active{transform:translate(4px,4px);box-shadow:2px 2px 0 var(--ink)}
  .note{margin-top:16px;font-weight:600;font-size:.9rem;opacity:.7}
  .note b{color:var(--blue)}

  footer{position:relative;z-index:4;text-align:center;padding:12px;
    font-weight:600;font-size:.74rem;opacity:.55}

  @media(prefers-reduced-motion:reduce){.row.a,.row.b{animation:none}}
</style>
</head>
